<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="header">
    <span class="logo">📸</span>
    <h1>FullShot</h1>
  </div>

  <div class="actions">
    <button class="btn primary" data-mode="full">
      <span class="ico">🖼️</span>
      <span class="txt"><strong>전체 페이지</strong><small>스크롤 끝까지 한 장으로</small></span>
    </button>
    <button class="btn" data-mode="visible">
      <span class="ico">🔲</span>
      <span class="txt"><strong>보이는 화면</strong><small>현재 뷰포트만</small></span>
    </button>
    <button class="btn" data-mode="area">
      <span class="ico">✂️</span>
      <span class="txt"><strong>영역 선택</strong><small>드래그한 영역만</small></span>
    </button>
  </div>

  <details class="settings">
    <summary>⚙️ 설정</summary>
    <label>
      기본 형식
      <select id="format">
        <option value="png">PNG</option>
        <option value="jpeg">JPEG</option>
        <option value="pdf">PDF</option>
      </select>
    </label>
    <label>
      JPEG 품질 <span id="qualityVal">0.92</span>
      <input type="range" id="quality" min="0.5" max="1" step="0.01" value="0.92" />
    </label>
    <label>
      스크롤 지연(ms) <span id="delayVal">200</span>
      <input type="range" id="scrollDelay" min="50" max="800" step="50" value="200" />
    </label>
  </details>

  <p class="status" id="status"></p>

  <script src="popup.js"></script>
</body>
</html>
