<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>FullShot 편집</title>
  <link rel="stylesheet" href="editor.css" />
</head>
<body>
  <header class="toolbar">
    <div class="brand">📸 FullShot</div>
    <div class="group">
      <button id="cropToggle" class="tool">✂️ 크롭</button>
      <button id="cropApply" class="tool" hidden>적용</button>
      <button id="cropCancel" class="tool" hidden>취소</button>
      <button id="resetBtn" class="tool" hidden>↩️ 원본</button>
    </div>
    <div class="group">
      <label>형식
        <select id="format">
          <option value="png">PNG</option>
          <option value="jpeg">JPEG</option>
          <option value="pdf">PDF</option>
        </select>
      </label>
      <label class="quality-wrap">품질
        <input type="range" id="quality" min="0.5" max="1" step="0.01" value="0.92" />
        <span id="qualityVal">0.92</span>
      </label>
    </div>
    <div class="group">
      <button id="downloadBtn" class="primary">⬇️ 저장</button>
      <button id="copyBtn">📋 복사</button>
    </div>
    <div class="meta" id="metaInfo"></div>
  </header>

  <main id="stage">
    <div id="loading">캡처 이미지를 합성하는 중…</div>
    <div id="viewport" hidden>
      <canvas id="preview"></canvas>
      <div id="cropBox" hidden></div>
    </div>
  </main>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="editor.js"></script>
</body>
</html>
